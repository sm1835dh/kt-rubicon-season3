# Galaxy Watch9 차이점 카드. combo/section은 data.json 기준, highlight는 화면 텍스트(포함 여부로 찾음).
cards:
  - id: ca-fr-translation
    title: CA-FR 옵션 제목 오역 (케이스 크기 → "여행 가방 크기")
    tags: [CA-FR 번역]
    panels:
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: case_size, highlight: ["Case size"], caption: CA-EN}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: case_size, highlight: ["Taille de la valise", "taille de boîtier"], caption: CA-FR}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: band_type, highlight: ["Type de bande", "type de bracelet"], caption: CA-FR 밴드 종류}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: trade_in, highlight: ["Trade-in"], caption: CA-FR 트레이드인}
    observation: |
      [사실] CA-FR의 케이스 크기 제목이 "Taille de la valise"(여행 가방 크기)입니다. 바로 아래 안내문은 "Choisissez votre option de taille de boîtier"(케이스 크기)로 맞게 번역돼 있습니다.
      [사실] 밴드 제목도 "Type de bande"·"Couleur de la bande"(띠·테이프)인데, 안내문과 옵션 값은 "bracelet"(시곗줄)입니다.
      [사실] 트레이드인 제목은 "Trade-in"으로 번역되지 않았습니다. 버튼은 "Oui s'il vous plaît / Non merci"로 번역돼 있습니다.
      [사실] 스펙 "Vitesse de l’unité centrale" 값이 "2.1GHz, 1,95 GHz"로, 한 값 안에서 소수점 표기(. 와 ,)와 띄어쓰기가 섞여 있습니다(주요 스펙 표 참고).
      [추정] 제목은 기계 번역, 안내문은 사람이 번역한 것으로 보입니다.
    note: |
      fr-CA 옵션 축 이름은 화면 제목이 아니라 표준 id(case_size, band_type)로 매핑합니다. 화면 제목을 그대로 답변에 쓰지 않습니다.
      섹션 매핑 패턴에 "taille de la valise"를 넣어 둔 이유입니다. 사이트가 고치면 "taille du boîtier"도 잡힙니다.

  - id: band-lineup
    title: 밴드 종류·색상 선택지 차이
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__40mm__bluetooth__graphite, section: band_type, highlight: ["Sport Band", "Misty Band", "Fabric Band"], caption: UK 밴드 종류}
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: band_type, highlight: ["Sport Band"], caption: CA-EN 밴드 종류}
      - {combo: us__40mm__bluetooth__graphite, section: band_type, highlight: ["Sport", "Misty", "Fabric"], caption: US 밴드 종류}
      - {combo: uk__40mm__bluetooth__graphite, section: band_color, highlight: ["Yellow", "Blue"], caption: UK 밴드 색상}
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: band_color, highlight: ["Olive"], caption: CA-EN 밴드 색상}
    observation: |
      [사실] UK·US는 밴드 종류가 Sport·Misty·Fabric 3개입니다. CA는 Sport Band 하나입니다.
      [사실] 40mm Graphite Sport Band 색상은 UK가 Black·Olive·Cream·Yellow·Blue 5개, CA가 Black·Olive 2개입니다.
      [사실] 표기도 다릅니다. UK·CA "Sport Band", US "Sport"이고, 밴드 크기는 UK·CA "S/M", US "Small/Medium"입니다.
    note: |
      밴드 옵션은 국가별 목록으로 수집합니다. 밴드 크기는 S/M = Small/Medium으로 정규화합니다.
      밴드는 가격 축이 아니어서(기본 밴드 포함 가격 동일) 가격 표에는 넣지 않았습니다.

  - id: care-plus-unit
    title: CA Care+ 가격에 기간 단위가 빠져 있음
    tags: [사이트 데이터 오류, 국가별 구성 차이]
    panels:
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: care, highlight: ["From $4.00 or $79.00", "From $3.00 or $59.00"], caption: CA-EN 워치}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: care, highlight: ["À partir de 4,00 $ ou 79,00 $"], caption: CA-FR 워치}
      - {combo: uk__40mm__bluetooth__graphite, section: care, highlight: ["£0.00 for 3 months then £5.99/mo", "£0.00 for 3 months then £4.99/mo"], caption: UK}
      - {combo: us__40mm__bluetooth__graphite, section: care, highlight: ["$49.00/2 Yr. Term", "Theft and Loss Insurance (only available in NY)"], caption: US}
    observation: |
      [사실] CA 워치 Care+는 "From $4.00 or $79.00"으로, $4.00이 월 요금인지 알 수 없습니다. 같은 CA 사이트의 노트북 Care+는 "From $13.00/month or $249.00"으로 단위가 있습니다. CA-FR도 "À partir de 4,00 $ ou 79,00 $"입니다.
      [사실] UK는 "£0.00 for 3 months then £5.99/mo"(도난·분실 포함)와 £4.99/mo 두 가지입니다.
      [사실] US는 $8.00/mo 또는 $49.00/2 Yr. Term(was $99.00)입니다. "Theft and Loss Insurance (only available in NY)"처럼 주(ZIP)에 따라 나오는 상품도 있습니다.
    note: |
      Care+ 가격은 {price, period: month|term, term_months}로 저장합니다. CA처럼 단위가 없으면 period를 비워 두고 "확인 필요"로 표시합니다. 추측해서 /month를 붙이지 않습니다.
      US Care+ 상품 목록은 ZIP(주)에 따라 다르므로 ZIP과 함께 저장합니다.

  - id: trade-in-credit
    title: 트레이드인·즉시 크레딧 안내
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__40mm__bluetooth__graphite, section: trade_in, highlight: ["Get £27 - £110 off when you trade in your old smartwatch"], caption: UK}
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: trade_in, highlight: ["Get an instant discount for trading in your current device."], caption: CA-EN}
      - {combo: us__40mm__bluetooth__graphite, section: trade_in, highlight: ["Samsung trade-in value up to $250.", "Get $50 Samsung Instant Credit"], caption: US}
      - {combo: us__40mm__bluetooth__graphite, section: bundle, highlight: ["Fabric Band", "$0.00"], caption: US 번들}
    observation: |
      [사실] UK는 "£27 - £110", US는 "up to $250"으로 트레이드인 금액을 보여 줍니다. CA는 금액이 없습니다.
      [사실] US는 $50 Samsung Instant Credit이 붙고, 번들에서 Fabric Band가 크레딧 적용 후 $0.00(was $54.99)로 나옵니다.
    note: |
      즉시 크레딧(credit)은 가격 할인이 아닙니다. 기기 가격($379.99)은 그대로이고, 다른 상품 구매에 쓰는 금액입니다. sale_price에 반영하지 않습니다.

  - id: us-monthly-no-currency
    title: US 상단 가격 바의 월 할부에 통화 기호가 없음
    tags: [사이트 데이터 오류]
    panels:
      - {combo: us__40mm__bluetooth__graphite, section: price_bar, highlight: ["$379.99 or 15.83/mo"], caption: 상단 가격 바}
      - {combo: us__40mm__bluetooth__graphite, section: purchase_option, highlight: ["$15.83/mo"], caption: 결제 방식}
    observation: |
      [사실] US 워치 상단 가격 바는 "$379.99 or 15.83/mo"로 월 할부 금액에 "$"가 없습니다. 아래 결제 방식에는 "$15.83/mo"로 나옵니다.
      [사실] 같은 US 사이트의 노트북 가격 바는 "$2,149.99 or $89.59/mo"로 "$"가 있습니다.
    note: |
      US 파서는 "/mo" 앞의 통화 기호 없는 숫자도 월 할부로 읽습니다(prices.money_tokens의 bare_monthly). 통화는 페이지 통화(USD)로 채웁니다.

  - id: ca-fr-offers
    title: CA-FR 오퍼가 CA-EN과 다름
    tags: [CA-FR 번역]
    panels:
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: offer_banner, highlight: ["Get a free 60-day Strava subscription"], caption: CA-EN 오퍼 배너}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: offer_banner, highlight: ["adhésion de 2 mois à iFIT"], caption: CA-FR 오퍼 배너}
      - {combo: ca-en-on__40mm__bluetooth__graphite, section: gifts, highlight: ["Bespoke Jet AI Jet Stick Vacuum"], caption: CA-EN 사은품·할인}
      - {combo: ca-fr-on__40mm__bluetooth__graphite, section: gifts, highlight: ["en validant votre statut"], caption: CA-FR 사은품·할인}
    observation: |
      [사실] 오퍼 배너는 CA-EN이 "Get a free 60-day Strava subscription", CA-FR이 "Strava 60일 + iFIT 2개월"입니다. iFIT 혜택은 CA-FR에만 적혀 있습니다.
      [사실] "Gifts and Savings"는 CA-EN에 함께 사면 할인되는 상품 캐러셀(Bespoke Jet AI 청소기 $750 할인 등)과 신분 인증 할인이 있습니다. CA-FR에는 신분 인증 할인(최대 20%) 하나만 있습니다.
    note: |
      오퍼는 언어 페이지마다 따로 수집합니다. 같은 주라도 EN 오퍼를 FR 답변에 그대로 쓰면 틀릴 수 있습니다.

  - id: gifts-structure
    title: 사은품·할인 구성 (UK는 목록형, US는 번들 크레딧형)
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__40mm__bluetooth__graphite, section: gifts, highlight: ["Claim 10 months Bupa Well+ Silver Family worth £500", "Get £50 off orders over £500 when you pay with PayPal"], caption: UK}
      - {combo: us__40mm__bluetooth__graphite, section: bundle, highlight: ["Don't miss out on your $50.00 Samsung Credit plus bundle savings for eligible products"], caption: US}
    observation: |
      [사실] UK "Gifts and Savings"는 7개 오퍼를 목록으로 보여 줍니다. Bupa Well+ 10개월(£500 상당), 트레이드인 £27~£110, PayPal £50, 밴드 30% 할인, Care+ 3개월 무료, Strava·iFIT 체험, 다른 Galaxy 기기와 함께 사면 10% 할인입니다. 오퍼마다 유효 기간이 적혀 있습니다.
      [사실] US는 오퍼 목록 대신 "$50 Samsung Credit + 번들 할인"으로 Buds4 Pro·Fabric Band·Buds4를 보여 줍니다.
    note: |
      오퍼는 {type: gift|discount|credit|trial|bundle, value, currency, valid_until, condition}으로 정규화합니다. UK 유효 기간(dd/mm/yy)은 날짜로 변환합니다.

  - id: lte-model-code
    title: LTE 모델 코드가 UK·CA(F)와 US(U)에서 다름
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__40mm__lte__graphite, section: summary, highlight: ["SM-L345FZKAEUB"], caption: UK LTE}
      - {combo: ca-en-on__40mm__lte__graphite, section: summary, highlight: ["SM-L345FZKAXAC"], caption: CA LTE}
      - {combo: us__40mm__lte__graphite, section: summary, highlight: ["SM-L345U / SM-L345UZKAXAA"], caption: US LTE}
    observation: |
      [사실] 40mm LTE 모델은 UK SM-L345FZKAEUB, CA SM-L345FZKAXAC, US SM-L345UZKAXAA입니다. Bluetooth 모델은 세 나라 모두 SM-L340N입니다.
      [사실] LTE 추가 금액은 UK +£50(£349 → £399), CA +$80($519.99 → $599.99), US +$50($379.99 → $429.99)입니다.
      [추정] F는 글로벌 LTE, U는 미국 통신사용 하드웨어입니다.
    note: |
      LTE 모델은 국가별 하드웨어가 다를 수 있습니다(동일 모델 아님 가능성). 스펙·지원 통신사는 국가 SKU 기준으로 수집합니다.
