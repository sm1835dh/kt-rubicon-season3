# Galaxy Z Fold8 Ultra 차이점 카드. combo/section은 data.json 기준, highlight는 화면 텍스트(포함 여부로 찾음).
cards:
  - id: price-format
    title: 용량 선택 영역의 가격 표기 형식
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: storage, highlight: ["£52.75/mo. or £1,899.00"]}
      - {combo: ca-en-on__256gb, section: storage, highlight: ["From $75.00/mo.‡ or $2,699.99"]}
      - {combo: ca-fr-on__256gb, section: storage, highlight: ["À partir de 75,00 $ /mo.‡ ou 2 699,99 $"]}
      - {combo: us__256gb__unlocked, section: storage, highlight: ["was: $2099.99", "$1,899.99"]}
    observation: |
      [사실] UK는 "£52.75/mo. or £1,899.00"(월 할부 or 일시불), CA-EN은 "From $75.00/mo.‡ or $2,699.99"처럼 각주 기호(‡)가 붙습니다.
      [사실] CA-FR은 "75,00 $ … 2 699,99 $"로 통화 기호가 뒤에 오고, 소수점은 쉼표, 천 단위는 공백입니다.
      [사실] US 용량 타일에는 월 할부가 없고 "was: $2099.99"(정가, 천 단위 쉼표 없음)와 "$1,899.99"(할인가, 쉼표 있음)가 함께 나옵니다. 같은 타일 안에서도 숫자 형식이 다릅니다.
    note: |
      가격은 list_price(정가·was) / sale_price / financing_monthly / financing_term / currency로 나눕니다. 월 할부는 금융 조건이라 기기 가격 필드에 넣지 않습니다.
      숫자 파서는 로캘별로 둡니다(fr-CA: 공백 천 단위 + 쉼표 소수점 + 뒤 통화 기호). US는 "was:" 접두와 쉼표 없는 숫자를 허용하고, ‡ 같은 각주 기호는 값에서 떼어 냅니다.

  - id: quebec-financing
    title: 퀘벡에서는 월 할부가 노출되지 않음
    tags: [국가별 구성 차이]
    panels:
      - {combo: ca-en-on__256gb, section: storage, highlight: ["From $75.00/mo.‡ or $2,699.99"], caption: Ontario}
      - {combo: ca-en-qc__256gb, section: storage, highlight: ["$2,699.99"], caption: Quebec}
      - {combo: ca-en-on__256gb, section: price_bar, highlight: ["$75.00"], caption: Ontario 상단 가격 바}
      - {combo: ca-en-qc__256gb, section: price_bar, highlight: ["$2,699.99"], caption: Quebec 상단 가격 바}
    observation: |
      [사실] SKU와 일시불 가격($2,699.99)은 같습니다. 그런데 Quebec에서는 용량 선택과 상단 가격 바 양쪽에서 월 할부(0% APR) 문구가 빠집니다. CA-FR(Québec)도 같고, 상단 바에는 "À partir de total 2 699,99 $"만 남습니다.
      [추정] 퀘벡의 금융 광고 규제 또는 Affirm 할부 미제공 때문으로 보입니다.
    note: |
      할부(financing) 정보는 국가가 아니라 주 단위 속성입니다. financing_available(province)를 두고, CA 크롤링은 ON·QC를 모두 수집합니다.
      퀘벡 사용자에게 월 할부 금액을 답하면 오답입니다. 답변 생성 시 province 컨텍스트가 없으면 "주별로 다를 수 있음"을 붙입니다.

  - id: us-verizon-financing
    title: US에서 Verizon을 고르면 결제 방식에 통신사 할부가 추가됨
    tags: [국가별 구성 차이]
    panels:
      - {combo: us__256gb__unlocked, section: purchase_option, highlight: ["Samsung Financing (Pay Monthly)", "Pay in 4 Payments"], caption: Unlocked}
      - {combo: us__256gb__verizon, section: purchase_option, highlight: ["Verizon Financing (Pay Monthly)", "$52.78/mo", "for 36 mos ⊕, 0% APR"], caption: Verizon}
    observation: |
      [사실] 일시불 가격은 Unlocked·Verizon 모두 $1,899.99로 같습니다.
      [사실] Verizon을 고르면 "Verizon Financing $52.78/mo, 36개월, 0% APR"이 추가됩니다. Samsung Financing은 $79.17/mo, 24개월입니다.
      [사실] Pay in 4($475.00, 2주마다)는 두 경우 모두 있습니다.
    note: |
      carrier(Unlocked/Verizon …)는 SKU 접미사(XAA/VZW)로 판별하고, 가격 문서에는 carrier 축을 둡니다.
      financing_options를 리스트(provider, monthly, term_months, apr)로 저장합니다. 통신사 할부는 통신사 약정 조건이므로 답변에 조건 출처를 함께 줍니다.

  - id: us-carrier-availability
    title: 정적 SKU 목록에는 있지만 화면에서는 고를 수 없는 조합
    tags: [소스 vs 화면 불일치]
    panels:
      - {combo: us__1tb__verizon, section: connectivity, highlight: ["The 1TB/Graphite is unavailable for Verizon devices", "Out of Stock"], caption: 1TB · Graphite · Verizon}
      - {combo: us__512gb__verizon, section: connectivity, highlight: ["See all deals"], caption: 512GB · Graphite · Verizon (선택 가능)}
    observation: |
      [사실] 페이지 소스의 SKU 목록에는 SM-F976UZKFVZW(1TB Graphite Verizon)가 있습니다. 하지만 화면에서는 "The 1TB/Graphite is unavailable for Verizon devices"와 "Out of Stock"이 나오고 Unlocked로 남습니다.
      [사실] Green Shadow는 SKU 목록 자체에 Unlocked(XAA)만 있습니다. 화면에서도 "The color Green Shadow is unavailable for Verizon devices"가 나옵니다(탐색 단계 확인).
    note: |
      판매 가능 여부는 SKU 목록이 아니라 렌더링 결과나 API로 판단합니다. availability는 (sku, carrier) 단위로 시점과 함께 저장합니다.
      재고·판매 가능 여부는 자주 바뀌므로 평가셋 정답으로 쓰지 않습니다.

  - id: trade-in
    title: 트레이드인 할인 표기
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: trade_in, highlight: ["£30.00 to £713.00"]}
      - {combo: ca-en-on__256gb, section: trade_in, highlight: ["$1,050.00"]}
      - {combo: us__256gb__unlocked, section: trade_in, highlight: ["Save upto $800", "Get $200 Samsung Instant Savings"]}
    observation: |
      [사실] UK는 할인 범위를 "£30.00 to £713.00"으로 표시합니다.
      [사실] CA는 "Save up to $1,050.00"이고, 각주에 Galaxy Z Fold7 1TB를 반납할 때 기준이라고 적혀 있습니다.
      [사실] US는 최대 $800이고, "No"를 고르면 "$200 Samsung Instant Savings"를 받습니다. 기본 선택이 No라서 화면 가격 $1,899.99에는 이 $200이 이미 반영돼 있습니다(정가 $2,099.99).
    note: |
      trade_in_offer(min, max, currency, basis_device)로 저장합니다. CA의 기준 기기 각주를 메타데이터로 남깁니다.
      US의 "트레이드인 안 함 = $200 할인"은 sale_price 해석에 영향을 줍니다. was − instant_savings = sale_price 관계를 파서가 알아야 합니다.

  - id: uk-trade-in-mismatch
    title: UK 같은 페이지 안에서 트레이드인 상한이 다름
    tags: [사이트 데이터 오류]
    panels:
      - {combo: uk__512gb, section: trade_in, highlight: ["£30 - £713"]}
      - {combo: uk__512gb, section: gifts, highlight: ["£30 - £730"]}
    observation: |
      [사실] 같은 페이지의 트레이드인 섹션은 "Get £30 - £713 off", Gifts and Savings 섹션은 "Get £30 - £730 off"입니다.
      [추정] 오퍼 문구 중 하나가 갱신되지 않은 것으로 보입니다.
    note: |
      같은 페이지 안의 수치 충돌입니다. 구매 단계 섹션이 프로모션 블록보다 우선하는 규칙을 두고, 충돌하면 플래그를 세웁니다.
      답변에는 범위 대신 "최대 할인은 기기에 따라 다름"과 링크를 주는 쪽이 안전합니다.

  - id: uk-carrier-plans
    title: "UK 전용 단계: 통신사 요금제 번들"
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: carrier_plans, highlight: ["Three", "O2", "Vodafone"]}
      - {combo: us__256gb__verizon, section: connectivity, highlight: ["See all deals"], caption: US는 통신사를 기기 SKU로 선택}
    observation: |
      [사실] UK에는 "Pay monthly phone contracts" 단계가 있습니다. Three·O2·Vodafone 24개월 요금제(월 £62~£69, 선납 £279)를 기기와 함께 팝니다.
      [사실] CA·US에는 이 단계가 없습니다. US는 통신사를 "Connectivity"에서 기기 SKU(통신사 잠금 모델)로 고릅니다.
    note: |
      "통신사"의 뜻이 국가마다 다릅니다. UK는 요금제 번들(tariff_plan), US는 통신사 전용 SKU(carrier_variant)이므로 엔티티를 따로 둡니다.
      UK 요금제의 월 요금·선납금은 기기 가격이 아니라서 가격 필드에 섞지 않습니다.

  - id: ca-upgrade-program
    title: "CA 전용 단계: Annual Upgrade Program"
    tags: [국가별 구성 차이]
    panels:
      - {combo: ca-en-on__256gb, section: upgrade_program, highlight: ["Choose the 12, 24 or 36-month program. No fees, 0% interest."]}
      - {combo: ca-fr-on__256gb, section: upgrade_program, highlight: ["Toujours flambant neuf."]}
    observation: |
      [사실] CA-EN·CA-FR에만 "Save more, upgrade sooner with the Annual Upgrade Program" 단계가 있습니다. 12·24·36개월, 수수료 없음, 0% 이자 조건이고, 12개월 프로그램에는 Care+가 포함됩니다.
      [사실] UK·US 구매 단계에는 이 프로그램이 없습니다.
    note: |
      CA 전용 정책 문서입니다. policy_type=upgrade_program, country=CA로 저장합니다. 금융 상품 사전에 Affirm, Flexiti와 함께 둡니다.

  - id: payment-promos
    title: 결제수단·카드 혜택
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: extra-1, highlight: ["PayPal"], caption: UK 상단 오퍼 배너}
      - {combo: ca-en-on__256gb, section: extra-1, highlight: ["Pay as low as"], caption: CA 상단 오퍼 배너}
      - {combo: us__256gb__unlocked, section: summary, highlight: ["Samsung Galaxy Card"], caption: US 주문 요약}
    observation: |
      [사실] UK 상단 배너에는 PayPal로 결제하면 £100을 할인해 주는 오퍼가 있습니다(여러 슬라이드 중 하나).
      [사실] CA 배너는 트레이드인을 하면 월 할부가 낮아진다는 Affirm 금융 문구입니다.
      [사실] US는 Samsung Galaxy Card로 결제하면 5% 캐시백과 보너스를 준다는 안내가 결제 단계와 주문 요약에 나옵니다.
    note: |
      promotion을 type으로 나눕니다(payment_method_discount / card_cashback / financing_promo). 기간과 캡쳐 시점을 함께 저장합니다.
      배너는 슬라이드라 크롤링할 때마다 보이는 오퍼가 바뀔 수 있습니다. 배너 텍스트가 아니라 오퍼 API나 FAQ를 원천으로 삼습니다.

  - id: care-plus
    title: Samsung Care+ 구성과 주별 보장 범위
    tags: [국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: care, highlight: ["£0.00 for 3 months then £13.49/mo"]}
      - {combo: ca-en-on__256gb, section: care, highlight: ["From $19.00/month or $379.00"]}
      - {combo: us__256gb__unlocked, section: care, highlight: ["$149.00/2 Yr. Term", "Theft and Loss Insurance (only available in NY)"]}
    observation: |
      [사실] UK는 첫 3개월 무료 후 월 £13.49 / £10.49입니다.
      [사실] CA는 Premium $19/월 또는 $379, Care+ $15/월 또는 $279입니다. 각주를 보면 같은 상품이라도 주에 따라 보장 의미가 다릅니다. ON 등은 "SmartThings Find's failure to locate", QC 등은 "loss or theft"입니다.
      [사실] US는 3종(Theft and Loss $149/2년, Care+ $69/2년, NY 전용 보험 $5.50/월)입니다.
    note: |
      care_plan(name, monthly, upfront, term, coverage, region_restriction)으로 저장합니다. CA 각주의 주별 보장 차이는 province 메타데이터로 분리합니다.
      "도난·분실 보장 되나요?"에 대한 답이 주에 따라 달라집니다.

  - id: feature-label-translation
    title: 기능 아이콘 문구 — CA-FR은 "양문형 냉장고"로 번역
    tags: [CA-FR 번역, 국가별 구성 차이]
    panels:
      - {combo: uk__256gb, section: device, highlight: ["Ultra wide"]}
      - {combo: ca-en-on__256gb, section: device, highlight: ["Side-by-Side"]}
      - {combo: ca-fr-on__256gb, section: device, highlight: ["Réfrigérateur côte à côte"]}
    observation: |
      [사실] 같은 기능 아이콘이 UK "Ultra wide", CA-EN "Side-by-Side", CA-FR "Réfrigérateur côte à côte"(양문형 냉장고)로 나옵니다.
      [추정] CA-FR은 가전 용어 사전의 "Side-by-Side(냉장고)" 번역이 휴대폰 페이지에 잘못 적용된 것으로 보입니다.
    note: |
      CA-FR 텍스트를 그대로 인덱싱하면 휴대폰 문서가 "냉장고" 질의에 걸릴 수 있습니다. 카테고리와 맞지 않는 용어(휴대폰 페이지의 가전 용어)를 검출하는 규칙을 둡니다.
      FR 값은 같은 모델의 EN 값과 교차 검증합니다. UK와 CA-EN도 문구가 달라서 기능 라벨은 정규화 대상에서 빼고 원문 청크로 둡니다.

  - id: color-name
    title: 색상명 표기 — 가격은 같고 이름은 섞여 있음
    tags: [사이트 데이터 오류, CA-FR 번역]
    panels:
      - {combo: uk__256gb, section: color, highlight: ["Violet Shadow"]}
      - {combo: ca-fr-on__256gb, section: color, highlight: ["Ombre Violet"]}
      - {combo: us__256gb__unlocked, section: color, highlight: ["Green Shadow"]}
    observation: |
      [사실] 부록의 색상별 가격 표를 보면, 모든 국가에서 색상에 따른 가격 차이가 없습니다(256GB 기준).
      [사실] 페이지 제목(title 태그)은 "Shadow Violet"이고, 화면 옵션과 JSON-LD는 "Violet Shadow"입니다(UK·CA). US 제목은 "in Green"이고 옵션은 "Green Shadow"입니다.
      [사실] CA-FR은 "Ombre Violet", "Ombre Vert", "Crème"으로 번역되고, data-englishname은 영어 원문을 유지합니다.
    note: |
      색상은 이름이 아니라 SKU 색상코드(ZK/ZV/ZW/DG)로 정규화하고, 표시명은 언어별 별칭으로 둡니다.
      title이나 meta에서 색상을 뽑지 않습니다. 가격 키에서 색상은 빼도 됩니다(Fold8 Ultra 기준).

  - id: ca-fr-province-typos
    title: CA-FR 주 선택 목록의 오탈자 (페이지 소스)
    tags: [CA-FR 번역, 사이트 데이터 오류]
    panels:
      - {combo: ca-fr-on__256gb, section: full, caption: 주 선택 바는 화면 맨 위}
    observation: |
      [사실] 페이지 소스의 주 선택 목록에 "Colombie-Britiannique"(→ Colombie-Britannique), "Îie-du-Price-Édouard"(→ Île-du-Prince-Édouard), "Territories du Nord-Ouest"(→ Territoires du Nord-Ouest)가 있습니다.
      [사실] 헤드리스 브라우저에서는 주 선택 드롭다운이 열리지 않아 목록 자체는 캡쳐하지 못했습니다. 위 값은 페이지 소스 기준입니다.
    note: |
      주 이름을 엔티티 사전으로 쓸 때 CA-FR 원문을 그대로 쓰면 안 됩니다. 주 코드(CA-BC, CA-PE, CA-NT)를 키로 쓰고, 표시명은 교정된 사전을 따로 둡니다.
